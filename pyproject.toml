[project]
name = "task-manager-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Binit Shrestha", email = "quinjet01234@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
task-manager-api = "task_manager_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]